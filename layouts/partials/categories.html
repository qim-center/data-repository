{{ with site.Taxonomies.categories }}
  <nav class="categories">
    <ul>
      {{ range $term, $pages := . }}
        <li>
          <a href="{{ .Page.RelPermalink }}" style="border-color: {{ partial "colormap-color.html" $term }}">{{ .Page.Title }}</a>
        </li>
      {{ end }}
    </ul>
  </nav>
{{ end }}

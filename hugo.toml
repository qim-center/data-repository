baseURL = 'https://data-repository.qim.dk/'
languageCode = 'en-us'
title = 'Qim Data Repository'

[params]
  defaultTheme = 'light'
#  viz-base-url = 'http://localhost:5173/public/index.html'
  defaultLicense = 'CC-BY-4.0'

# Colormap per category. Valid values: viridis, plasma, inferno, magma, cividis, grayscale.
# A dataset's colormap is the last category in its front matter that has an entry here.
# The default is used when no category matches.
[params.colormaps]
  default = 'viridis'
  animal = 'plasma'
  material = 'cividis'
  plant = 'viridis'

# Representative color for each colormap, used to tint category pill borders.
# Tweak these to taste; they only matter for the category pill outlines.
[params.colormapColors]
  default = '#2f3134'
  viridis = '#23c952'
  plasma = '#ec4899'
  inferno = '#f94f16'
  magma = '#f75555'
  cividis = '#c7c002'
  grayscale = '#6b7280'

[params.licenses.'CC-BY-4.0']
  name = 'Creative Commons Attribution 4.0 International'
  url = 'https://creativecommons.org/licenses/by/4.0/'

[params.licenses.'CC-BY-SA-4.0']
  name = 'Creative Commons Attribution-ShareAlike 4.0 International'
  url = 'https://creativecommons.org/licenses/by-sa/4.0/'

[params.licenses.'CC-BY-NC-4.0']
  name = 'Creative Commons Attribution-NonCommercial 4.0 International'
  url = 'https://creativecommons.org/licenses/by-nc/4.0/'

[params.licenses.'CC-BY-NC-SA-4.0']
  name = 'Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International'
  url = 'https://creativecommons.org/licenses/by-nc-sa/4.0/'

[params.licenses.'CC-BY-ND-4.0']
  name = 'Creative Commons Attribution-NoDerivatives 4.0 International'
  url = 'https://creativecommons.org/licenses/by-nd/4.0/'

[params.licenses.'CC-BY-NC-ND-4.0']
  name = 'Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International'
  url = 'https://creativecommons.org/licenses/by-nc-nd/4.0/'
